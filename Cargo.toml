[package]
name = "rusty_query_lab"
version = "0.1.0"
edition = "2024"

[dependencies]
comfy-table = "8.0.0"
dirs = "6.0.0"
iced = { version = "0.14.0", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
